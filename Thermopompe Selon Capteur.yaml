blueprint:
  name: Thermopompe intelligente Heat Cool Auto
  description: Contrôle une thermopompe selon un capteur externe sans jamais l'éteindre.
  domain: automation

  input:
    climate_entity:
      name: Thermopompe
      selector:
        entity:
          domain: climate

    inside_sensor:
      name: Température intérieure
      selector:
        entity:
          domain: sensor
          device_class: temperature

    outside_sensor:
      name: Température extérieure (optionnelle)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    operation_mode:
      name: Mode
      default: auto
      selector:
        select:
          options:
            - heat
            - cool
            - auto

    heat_setpoint:
      name: Consigne chauffage
      default: 21
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

    cool_setpoint:
      name: Consigne climatisation
      default: 24
      selector:
        number:
          min: 18
          max: 35
          step: 0.5
          unit_of_measurement: "°C"

    idle_heat_temperature:
      name: Température de repos chauffage
      default: 18
      selector:
        number:
          min: 10
          max: 25
          step: 0.5
          unit_of_measurement: "°C"

    idle_cool_temperature:
      name: Température de repos climatisation
      default: 30
      selector:
        number:
          min: 25
          max: 35
          step: 0.5
          unit_of_measurement: "°C"

    hysteresis:
      name: Hystérésis
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 3
          step: 0.1
          unit_of_measurement: "°C"

    min_outdoor_for_cooling:
      name: Température extérieure minimale pour climatisation
      default: 15
      selector:
        number:
          min: 0
          max: 25
          step: 1
          unit_of_measurement: "°C"

trigger:
  - platform: state
    entity_id: !input inside_sensor

  - platform: homeassistant
    event: start

variables:
  inside_sensor: !input inside_sensor
  outside_sensor: !input outside_sensor

  indoor: >
    {{ states(inside_sensor) | float(0) }}

  outdoor: >
    {% if outside_sensor != '' %}
      {{ states(outside_sensor) | float(99) }}
    {% else %}
      99
    {% endif %}

  mode: !input operation_mode
  heat_sp: !input heat_setpoint
  cool_sp: !input cool_setpoint
  idle_heat: !input idle_heat_temperature
  idle_cool: !input idle_cool_temperature
  hyst: !input hysteresis
  min_cool: !input min_outdoor_for_cooling

action:
  - choose:

      #
      # MODE CHAUFFAGE
      #

      - conditions:
          - condition: template
            value_template: "{{ mode == 'heat' }}"
        sequence:

          - choose:

              - conditions:
                  - condition: template
                    value_template: >
                      {{ indoor < (heat_sp - hyst) }}
                sequence:
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: heat

                  - service: climate.set_temperature
                    target:
                      entity_id: !input climate_entity
                    data:
                      temperature: !input heat_setpoint

            default:

              - service: climate.set_hvac_mode
                target:
                  entity_id: !input climate_entity
                data:
                  hvac_mode: heat

              - service: climate.set_temperature
                target:
                  entity_id: !input climate_entity
                data:
                  temperature: !input idle_heat_temperature

      #
      # MODE CLIMATISATION
      #

      - conditions:
          - condition: template
            value_template: "{{ mode == 'cool' }}"
        sequence:

          - choose:

              - conditions:
                  - condition: template
                    value_template: >
                      {{
                        indoor > (cool_sp + hyst)
                        and outdoor > min_cool
                      }}
                sequence:
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: cool

                  - service: climate.set_temperature
                    target:
                      entity_id: !input climate_entity
                    data:
                      temperature: !input cool_setpoint

            default:

              - service: climate.set_hvac_mode
                target:
                  entity_id: !input climate_entity
                data:
                  hvac_mode: cool

              - service: climate.set_temperature
                target:
                  entity_id: !input climate_entity
                data:
                  temperature: !input idle_cool_temperature

      #
      # MODE AUTO
      #

      - conditions:
          - condition: template
            value_template: "{{ mode == 'auto' }}"
        sequence:

          - choose:

              # Chauffage requis
              - conditions:
                  - condition: template
                    value_template: >
                      {{ indoor < (heat_sp - hyst) }}
                sequence:

                  - service: climate.set_hvac_mode
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: heat

                  - service: climate.set_temperature
                    target:
                      entity_id: !input climate_entity
                    data:
                      temperature: !input heat_setpoint

              # Climatisation requise
              - conditions:
                  - condition: template
                    value_template: >
                      {{
                        indoor > (cool_sp + hyst)
                        and outdoor > min_cool
                      }}
                sequence:

                  - service: climate.set_hvac_mode
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: cool

                  - service: climate.set_temperature
                    target:
                      entity_id: !input climate_entity
                    data:
                      temperature: !input cool_setpoint

            default:

              - choose:

                  - conditions:
                      - condition: template
                        value_template: >
                          {{ indoor < ((heat_sp + cool_sp) / 2) }}
                    sequence:

                      - service: climate.set_hvac_mode
                        target:
                          entity_id: !input climate_entity
                        data:
                          hvac_mode: heat

                      - service: climate.set_temperature
                        target:
                          entity_id: !input climate_entity
                        data:
                          temperature: !input idle_heat_temperature

                default:

                  - service: climate.set_hvac_mode
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: cool

                  - service: climate.set_temperature
                    target:
                      entity_id: !input climate_entity
                    data:
                      temperature: !input idle_cool_temperature

mode: restart