blueprint:
  name: Thermopompe intelligente Heat Cool Auto
  description: Contrôle une thermopompe à partir d'un capteur de température externe.
  domain: automation

  input:
    climate_entity:
      name: Thermopompe
      selector:
        entity:
          domain: climate

    inside_sensor:
      name: Température intérieure
      selector:
        entity:
          domain: sensor
          device_class: temperature

    outside_sensor:
      name: Température extérieure (optionnelle)
      default:
      selector:
        entity:
          domain: sensor
          device_class: temperature

    operation_mode:
      name: Mode
      default: auto
      selector:
        select:
          options:
            - heat
            - cool
            - auto

    heat_setpoint:
      name: Consigne chauffage
      default: 21
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

    cool_setpoint:
      name: Consigne climatisation
      default: 24
      selector:
        number:
          min: 18
          max: 35
          step: 0.5
          unit_of_measurement: "°C"

    hysteresis:
      name: Hystérésis
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 3
          step: 0.1
          unit_of_measurement: "°C"

    min_outdoor_for_cooling:
      name: Température extérieure minimale pour climatisation
      default: 15
      selector:
        number:
          min: 0
          max: 25
          step: 1
          unit_of_measurement: "°C"

    fan_mode:
      name: Vitesse ventilateur
      default: auto
      selector:
        select:
          options:
            - auto
            - low
            - medium
            - high

trigger:
  - platform: state
    entity_id: !input inside_sensor

  - platform: homeassistant
    event: start

variables:
  climate_entity: !input climate_entity
  inside_sensor: !input inside_sensor
  outside_sensor: !input outside_sensor
  mode: !input operation_mode
  heat_sp: !input heat_setpoint
  cool_sp: !input cool_setpoint
  hyst: !input hysteresis
  min_cool: !input min_outdoor_for_cooling
  fan: !input fan_mode

  indoor: >
    {{ states(inside_sensor) | float(0) }}

  outdoor: >
    {% if outside_sensor %}
      {{ states(outside_sensor) | float(99) }}
    {% else %}
      99
    {% endif %}

action:
  - choose:

      #
      # CHAUFFAGE
      #

      - conditions:
          - condition: template
            value_template: >
              {{ mode == 'heat' and indoor < (heat_sp - hyst) }}
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: heat

          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: !input heat_setpoint

          - service: climate.set_fan_mode
            target:
              entity_id: !input climate_entity
            data:
              fan_mode: !input fan_mode

      - conditions:
          - condition: template
            value_template: >
              {{ mode == 'heat' and indoor > (heat_sp + hyst) }}
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity

      #
      # CLIMATISATION
      #

      - conditions:
          - condition: template
            value_template: >
              {{
                mode == 'cool'
                and indoor > (cool_sp + hyst)
                and outdoor > min_cool
              }}
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: cool

          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: !input cool_setpoint

          - service: climate.set_fan_mode
            target:
              entity_id: !input climate_entity
            data:
              fan_mode: !input fan_mode

      - conditions:
          - condition: template
            value_template: >
              {{ mode == 'cool' and indoor < (cool_sp - hyst) }}
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity

      #
      # AUTO -> CHAUFFAGE
      #

      - conditions:
          - condition: template
            value_template: >
              {{ mode == 'auto' and indoor < (heat_sp - hyst) }}
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: heat

          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: !input heat_setpoint

          - service: climate.set_fan_mode
            target:
              entity_id: !input climate_entity
            data:
              fan_mode: !input fan_mode

      #
      # AUTO -> CLIMATISATION
      #

      - conditions:
          - condition: template
            value_template: >
              {{
                mode == 'auto'
                and indoor > (cool_sp + hyst)
                and outdoor > min_cool
              }}
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: cool

          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: !input cool_setpoint

          - service: climate.set_fan_mode
            target:
              entity_id: !input climate_entity
            data:
              fan_mode: !input fan_mode

      #
      # ZONE DE CONFORT
      #

      - conditions:
          - condition: template
            value_template: >
              {{
                mode == 'auto'
                and indoor >= (heat_sp - hyst)
                and indoor <= (cool_sp + hyst)
              }}
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity

mode: restart