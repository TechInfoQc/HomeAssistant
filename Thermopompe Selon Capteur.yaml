blueprint:
  name: Thermopompe intelligente (Heat/Cool/Auto)
  description: >
    Contrôle une thermopompe avec un capteur de température externe.
    Supporte chauffage, climatisation et mode automatique.

  domain: automation

  input:
    climate_entity:
      name: Thermopompe
      selector:
        entity:
          domain: climate

    inside_sensor:
      name: Température intérieure
      selector:
        entity:
          domain: sensor
          device_class: temperature

    outside_sensor:
      name: Température extérieure (optionnelle)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    operation_mode:
      name: Mode de fonctionnement
      default: auto
      selector:
        select:
          options:
            - heat
            - cool
            - auto

    heat_setpoint:
      name: Consigne chauffage
      default: 21
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          unit_of_measurement: °C

    cool_setpoint:
      name: Consigne climatisation
      default: 24
      selector:
        number:
          min: 18
          max: 35
          step: 0.5
          unit_of_measurement: °C

    hysteresis:
      name: Hystérésis
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 3
          step: 0.1
          unit_of_measurement: °C

    min_outdoor_for_cooling:
      name: Température extérieure minimale pour climatisation
      default: 15
      selector:
        number:
          min: 0
          max: 25
          step: 1
          unit_of_measurement: °C

    fan_mode:
      name: Vitesse ventilateur
      default: auto
      selector:
        select:
          options:
            - auto
            - low
            - medium
            - high

    notify_device:
      name: Service notification (optionnel)
      default: ""
      selector:
        text:

trigger:
  - platform: state
    entity_id: !input inside_sensor

variables:
  indoor: "{{ 