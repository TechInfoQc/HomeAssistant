blueprint:
  name: Thermopompe intelligente Heat Cool Auto avec horaire
  description: >
    Contrôle une thermopompe selon un capteur intérieur sans jamais l'éteindre.
    Le contrôle n'est actif qu'entre une heure de début et une heure de fin.
    Hors période, une température prédéfinie est appliquée.

  domain: automation

  input:
    climate_entity:
      name: Thermopompe
      selector:
        entity:
          domain: climate

    inside_sensor:
      name: Température intérieure
      selector:
        entity:
          domain: sensor
          device_class: temperature

    operation_mode:
      name: Mode
      default: auto
      selector:
        select:
          options:
            - heat
            - cool
            - auto

    start_time:
      name: Heure de début du contrôle
      default: "06:00:00"
      selector:
        time:

    end_time:
      name: Heure de fin du contrôle
      default: "22:00:00"
      selector:
        time:

    end_period_temperature:
      name: Température hors période
      default: 20
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

    heat_setpoint:
      name: Consigne chauffage
      default: 21
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

    cool_setpoint:
      name: Consigne climatisation
      default: 24
      selector:
        number:
          min: 18
          max: 35
          step: 0.5
          unit_of_measurement: "°C"

    idle_heat_temperature:
      name: Température de repos chauffage
      default: 18
      selector:
        number:
          min: 10
          max: 25
          step: 0.5
          unit_of_measurement: "°C"

    idle_cool_temperature:
      name: Température de repos climatisation
      default: 30
      selector:
        number:
          min: 25
          max: 35
          step: 0.5
          unit_of_measurement: "°C"

    hysteresis:
      name: Hystérésis
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 3
          step: 0.1
          unit_of_measurement: "°C"

    force_cool_delta:
      name: Delta forcé pour climatisation
      description: "Différence utilisée pour forcer une consigne plus basse si nécessaire"
      default: 1
      selector:
        number:
          min: 0.5
          max: 5
          step: 0.1
          unit_of_measurement: "°C"



trigger:
  - platform: state
    entity_id: !input inside_sensor

  - platform: homeassistant
    event: start

  - platform: time_pattern
    minutes: "/5"

variables:
  inside_sensor: !input inside_sensor

  inside_state: >
    {{ states(inside_sensor) }}

  inside_valid: >
    {{ (states(inside_sensor) not in ['unknown','unavailable','', None]) }}

  indoor: >
    {{ states(inside_sensor) | float(0) }}


  mode: !input operation_mode
  heat_sp: !input heat_setpoint
  cool_sp: !input cool_setpoint
  idle_heat: !input idle_heat_temperature
  idle_cool: !input idle_cool_temperature
  hyst: !input hysteresis

  thermostat_entity: !input climate_entity

  thermostat_temp: >
    {{ state_attr(thermostat_entity, 'current_temperature') | float(-999) }}

  thermostat_valid: >
    {{ state_attr(thermostat_entity, 'current_temperature') is not none }}


  start_time: !input start_time
  end_time: !input end_time

  control_active: >
    {% set now_time = now().strftime('%H:%M:%S') %}
    {% if start_time <= end_time %}
      {{ start_time <= now_time <= end_time }}
    {% else %}
      {{ now_time >= start_time or now_time <= end_time }}
    {% endif %}

action:
  - choose:

      #
      # HORS PÉRIODE DE CONTRÔLE
      #
      - conditions:
          - condition: template
            value_template: "{{ not control_active }}"
        sequence:

          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: !input end_period_temperature

    default:

      - choose:

          #
          # MODE CHAUFFAGE
          #
          - conditions:
              - condition: template
                value_template: "{{ mode == 'heat' }}"
            sequence:

              - choose:

                  - conditions:
                      - condition: template
                        value_template: >
                          {{ inside_valid and (indoor < (heat_sp - hyst)) }}

                    sequence:
                      - service: climate.set_hvac_mode
                        target:
                          entity_id: !input climate_entity
                        data:
                          hvac_mode: heat

                      - service: climate.set_temperature
                        target:
                          entity_id: !input climate_entity
                        data:
                          temperature: !input heat_setpoint

                default:
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: heat

                  - service: climate.set_temperature
                    target:
                      entity_id: !input climate_entity
                    data:
                      temperature: !input idle_heat_temperature

          #
          # MODE CLIMATISATION
          #
          - conditions:
              - condition: template
                value_template: "{{ mode == 'cool' }}"
            sequence:

              - choose:

                  - conditions:
                      - condition: template
                        value_template: >
                          {{
                            (inside_valid and (indoor > (cool_sp + hyst)))
                            or (thermostat_valid and (thermostat_temp > cool_sp))
                          }}

                    sequence:
                      - service: climate.set_hvac_mode
                        target:
                          entity_id: !input climate_entity
                        data:
                          hvac_mode: cool

                      - service: climate.set_temperature
                        target:
                          entity_id: !input climate_entity
                        data:
                          temperature: >
                            {% if thermostat_valid and (thermostat_temp <= cool_sp) %}
                              {{ (thermostat_temp - (!input force_cool_delta)) | round(1) }}
                            {% else %}
                              {{ cool_sp }}
                            {% endif %}

                default:
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: cool

                  - service: climate.set_temperature
                    target:
                      entity_id: !input climate_entity
                    data:
                      temperature: !input idle_cool_temperature

          #
          # MODE AUTO
          #
          - conditions:
              - condition: template
                value_template: "{{ mode == 'auto' }}"
            sequence:

              - choose:

                  - conditions:
                      - condition: template
                        value_template: >
                          {{ indoor < (heat_sp - hyst) }}

                    sequence:
                      - service: climate.set_hvac_mode
                        target:
                          entity_id: !input climate_entity
                        data:
                          hvac_mode: heat

                      - service: climate.set_temperature
                        target:
                          entity_id: !input climate_entity
                        data:
                          temperature: !input heat_setpoint

                  - conditions:
                      - condition: template
                        value_template: >
                          {{
                            indoor > (cool_sp + hyst)
                            and outdoor > min_cool
                          }}

                    sequence:
                      - service: climate.set_hvac_mode
                        target:
                          entity_id: !input climate_entity
                        data:
                          hvac_mode: cool

                      - service: climate.set_temperature
                        target:
                          entity_id: !input climate_entity
                        data:
                          temperature: !input cool_setpoint

                default:

                  - choose:

                      - conditions:
                          - condition: template
                            value_template: >
                              {{ indoor < ((heat_sp + cool_sp) / 2) }}

                        sequence:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: !input climate_entity
                            data:
                              hvac_mode: heat

                          - service: climate.set_temperature
                            target:
                              entity_id: !input climate_entity
                            data:
                              temperature: !input idle_heat_temperature

                    default:
                      - service: climate.set_hvac_mode
                        target:
                          entity_id: !input climate_entity
                        data:
                          hvac_mode: cool

                      - service: climate.set_temperature
                        target:
                          entity_id: !input climate_entity
                        data:
                          temperature: !input idle_cool_temperature

mode: restart